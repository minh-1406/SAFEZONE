<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tải Hướng Dẫn Sử Dụng SafeZone (Word .docx)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #f0f4ff 0%, #ffffff 50%, #f5f3ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 36px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 40px -15px rgba(30, 58, 138, 0.12), 0 0 0 1px rgba(226, 232, 240, 0.8);
      text-align: center;
    }
    .icon-badge {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 20px auto;
      box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 10px 0;
    }
    p {
      color: #64748b;
      font-size: 15px;
      line-height: 1.6;
      margin: 0 0 24px 0;
    }
    .file-info {
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 16px;
      padding: 14px 18px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
    }
    .file-name {
      font-weight: 700;
      color: #1e293b;
      font-size: 14px;
    }
    .file-size {
      color: #059669;
      font-weight: 700;
      font-size: 12px;
      background: #ecfdf5;
      padding: 4px 10px;
      border-radius: 999px;
    }
    .btn-download {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
      color: #ffffff;
      font-weight: 800;
      font-size: 16px;
      padding: 16px 24px;
      border-radius: 16px;
      text-decoration: none;
      box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 25px -5px rgba(79, 70, 229, 0.45);
    }
    .note {
      margin-top: 18px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-badge">📄</div>
    <h1>Tải Hướng Dẫn Sử Dụng SafeZone</h1>
    <p>Tệp Word (.docx) chuẩn hóa hướng dẫn chi tiết quy trình cho Học sinh, Cán bộ tư vấn và Ban Giám hiệu.</p>
    
    <div class="file-info">
      <div>
        <div class="file-name">Huong_Dan_Su_Dung_SafeZone.docx</div>
        <div style="font-size: 12px; color: #94a3b8; margin-top: 2px;">Microsoft Word Document</div>
      </div>
      <div class="file-size">20 KB</div>
    </div>

    <a id="downloadBtn" class="btn-download" href="/Huong_Dan_Su_Dung_SafeZone.docx" download="Huong_Dan_Su_Dung_SafeZone.docx">
      ⬇️ Bấm Vào Đây Để Tải File Word
    </a>

    <div class="note">
      Trình duyệt sẽ tự động kích hoạt tải xuống trong giây lát...
    </div>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", function() {
      setTimeout(function() {
        var link = document.getElementById("downloadBtn");
        if (link) {
          link.click();
        }
      }, 600);
    });
  </script>
</body>
</html>
