<!DOCTYPE html>
<html lang="vi">
  <head>
    <script>
      (function() {
        // Suppress and handle Vite HMR WebSocket errors when HMR is disabled in iframe environment
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('ws') !== -1 ||
            msg.indexOf('@vite/client') !== -1 ||
            msg.indexOf('vite-hmr') !== -1
          ) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        });
        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || event.filename || '')) || '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('@vite/client') !== -1 ||
            msg.indexOf('vite-hmr') !== -1
          ) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);

        // Safe mock for Vite HMR WebSocket connection to prevent 'WebSocket closed without opened'
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isHmr = (typeof protocols === 'string' && protocols.indexOf('vite-hmr') !== -1) ||
                        (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
                        (typeof url === 'string' && url.indexOf('token=') !== -1);
            if (isHmr) {
              var target = new EventTarget();
              target.url = String(url);
              target.protocol = 'vite-hmr';
              target.readyState = 1;
              target.OPEN = 1;
              target.CLOSED = 3;
              target.CLOSING = 2;
              target.CONNECTING = 0;
              target.binaryType = 'blob';
              target.bufferedAmount = 0;
              target.extensions = '';
              target.send = function() {};
              target.close = function() { target.readyState = 3; };
              setTimeout(function() {
                target.dispatchEvent(new Event('open'));
              }, 0);
              return target;
            }
            return new OriginalWebSocket(url, protocols);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
          window.WebSocket.OPEN = OriginalWebSocket.OPEN;
          window.WebSocket.CLOSING = OriginalWebSocket.CLOSING;
          window.WebSocket.CLOSED = OriginalWebSocket.CLOSED;
        }
      })();
    </script>
